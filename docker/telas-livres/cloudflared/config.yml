# Configuração do Cloudflare Named Tunnel (Zero Trust Ingress)
# Exposição segura da API e painéis sem abertura de portas (NAT/Port Forwarding) no roteador
tunnel: your-tunnel-uuid-here
credentials-file: /etc/cloudflared/credentials.json

ingress:
  - hostname: api.example.com
    service: http://api:8000
  - hostname: tablet.example.com
    service: http://api:8000/player/
  - hostname: admin.example.com
    service: http://api:8000/admin/
  # Fallback obrigatório do Cloudflare
  - service: http_status:404
