services:
  db:
    image: postgres:15-alpine
    container_name: telas_livres_db_homolog
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER_HOMOLOG:-telas_homolog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_HOMOLOG:-change_me_homolog_pass}
      POSTGRES_DB: ${POSTGRES_DB_HOMOLOG:-telas_livres_homolog}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:5433:5432"
    volumes:
      - postgres_data_homolog:/var/lib/postgresql/data

  api:
    build: .
    container_name: telas_livres_api_homolog
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8001:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER_HOMOLOG:-telas_homolog}:${POSTGRES_PASSWORD_HOMOLOG:-change_me_homolog_pass}@db:5432/${POSTGRES_DB_HOMOLOG:-telas_livres_homolog}
      - UPLOAD_DIR=${UPLOAD_DIR:-videos}
      - SECRET_KEY=${SECRET_KEY:-change_this_jwt_secret_key_homolog}
      - ALGORITHM=${ALGORITHM:-HS256}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    volumes:
      - .:/app
      - videos_data_homolog:/app/videos
    working_dir: /app
    depends_on:
      - db

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: telas_livres_tunnel_homolog
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN_HOMOLOG:-}
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
    depends_on:
      - api
    profiles:
      - tunnel

volumes:
  postgres_data_homolog:
  videos_data_homolog:
