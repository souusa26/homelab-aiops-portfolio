apiVersion: 1
contactPoints:
  - orgId: 1
    name: "HomeLab-Telegram"
    receivers:
      - uid: homelab_telegram_receiver
        type: telegram
        settings:
          bottoken: "${TELEGRAM_BOT_TOKEN}"
          chatid: "${TELEGRAM_CHAT_ID}"
          message: "{{ template \"telegram.message\" . }}"
          parse_mode: "HTML"
        disableResolveMessage: false
