# =============================================================================
# Stack de observabilidade do homelab
#   Prometheus  -> TSDB, scrape a cada 15s, retenção 15d
#   Grafana     -> dashboards + alerting provisionado como código (Telegram)
#   Exporters   -> node, cAdvisor, blackbox, Plex, qBittorrent (+ mc-monitor em outra stack)
#   Uptime Kuma -> checks sintéticos / status page
#
# Subir:  cp .env.example .env && docker compose up -d
# Outras stacks (minecraft, etc.) se penduram na rede "monitoring_monitor-net".
# =============================================================================

networks:
  monitor-net:
    driver: bridge

volumes:
  prometheus_data: {}
  grafana_data: {}
  uptime_kuma_data: {}

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Tokens de scrape ficam em arquivos fora do git (ver prometheus/secrets/README.md)
      - ./prometheus/secrets:/etc/prometheus/secrets:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}'
      - '--web.enable-lifecycle'   # permite `curl -X POST :9090/-/reload` após editar o yml
    extra_hosts:
      # Serviços em network_mode: host (Home Assistant, Plex) são alcançados pelo gateway do host
      - "host.docker.internal:host-gateway"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9090:9090"
    restart: unless-stopped
    networks:
      - monitor-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Consumidas pelo contactpoints.yml (Grafana faz interpolação de env no provisioning)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - PUBLIC_APP_DOMAIN=${PUBLIC_APP_DOMAIN}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - monitor-net

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped
    networks:
      - monitor-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8082:8080"
    restart: unless-stopped
    networks:
      - monitor-net

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3001:3001"
    restart: unless-stopped
    networks:
      - monitor-net

  plex-exporter:
    image: ghcr.io/cplieger/plex-exporter:latest
    container_name: plex_exporter
    environment:
      - PLEX_URL=${PLEX_URL:-http://host.docker.internal:32400}
      - PLEX_TOKEN=${PLEX_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - monitor-net

  qbittorrent-exporter:
    image: ghcr.io/martabal/qbittorrent-exporter:latest
    container_name: qbittorrent-exporter
    environment:
      - QBITTORRENT_BASE_URL=${QBITTORRENT_BASE_URL:-http://host.docker.internal:8080}
      - QBITTORRENT_USERNAME=${QBITTORRENT_USERNAME}
      - QBITTORRENT_PASSWORD=${QBITTORRENT_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - monitor-net

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    restart: unless-stopped
    networks:
      - monitor-net
